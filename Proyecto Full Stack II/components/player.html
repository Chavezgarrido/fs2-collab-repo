<aside id="player-aside" class="pulse-player-container">
  <div class="pulse-mini-player cursor-pointer" id="mobile-expand-trigger">
    <div class="pulse-mini-left" id="mini-track-info-area">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23231c36'><rect width='24' height='24' fill='%230e0b16'/><circle cx='12' cy='12' r='8' fill='%231a1528'/><circle cx='12' cy='12' r='3' fill='%230e0b16'/></svg>" id="mini-cover" alt="Sin reproducir">
      <div class="pulse-mini-info">
        <span class="pulse-mini-title" id="mini-title">No se está reproduciendo nada</span>
        <span class="pulse-mini-artist" id="mini-artist">Elige una pista para comenzar</span>
      </div>
    </div>
    
    <div class="pulse-mini-controls">
      <button class="pulse-btn-icon" id="btn-mini-favorite" type="button" aria-label="Favorito">
        <i class="bi bi-heart"></i>
      </button>
      <button class="pulse-btn-icon" id="btn-mini-play" type="button" aria-label="Reproducir">
        <i class="bi bi-play-fill"></i>
      </button>
    </div>

    <div class="pulse-mini-progress-bar">
      <div class="pulse-mini-progress-fill" id="mini-progress-fill" style="width: 0%;"></div>
    </div>
  </div>

  <div class="pulse-full-player position-relative" id="sp-full-player" style="padding-bottom: 70px;">
    
    <div class="pulse-full-header">
      <button class="pulse-btn-icon" id="btn-close-fullscreen" type="button" aria-label="Minimizar">
        <i class="bi bi-chevron-down fs-4"></i>
      </button>
      <div class="text-center text-truncate px-2">
        <span class="pulse-tag">REPRODUCIENDO EN PULSE</span>
        <span class="pulse-subtag d-block text-truncate" id="full-header-title">En espera</span>
      </div>
      <button class="pulse-btn-icon" type="button">
        <i class="bi bi-three-dots-vertical fs-5"></i>
      </button>
    </div>

    <div class="pulse-full-cover-wrapper">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 24 24' fill='%23231c36'><rect width='24' height='24' fill='%230e0b16'/><circle cx='12' cy='12' r='9' fill='%231a1528'/><circle cx='12' cy='12' r='3' fill='%230e0b16'/><circle cx='12' cy='12' r='1' fill='%23b26bff'/></svg>" id="current-cover" alt="Sin reproducir">
    </div>

    <div class="pulse-full-info-row">
      <div class="pulse-full-meta text-truncate">
        <h4 class="pulse-full-title text-truncate mb-0" id="current-title">No hay música en reproducción</h4>
        <span class="pulse-full-artist text-truncate" id="current-artist">Elige una canción para comenzar</span>
      </div>
      <button class="pulse-btn-icon" id="btn-favorite" type="button" aria-label="Favorito">
        <i class="bi bi-heart fs-4"></i>
      </button>
    </div>

    <div class="pulse-full-timeline">
      <input type="range" class="form-range player-range w-100" id="playback-bar" min="0" max="100" value="0">
      <div class="d-flex justify-content-between text-muted-pulse extra-small mt-1">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="pulse-full-controls">
      <button class="pulse-btn-icon" id="btn-shuffle" type="button" aria-label="Aleatorio">
        <i class="bi bi-shuffle fs-5"></i>
      </button>
      <button class="pulse-btn-icon" id="btn-prev" type="button" aria-label="Anterior">
        <i class="bi bi-skip-start-fill fs-2"></i>
      </button>
      <button class="pulse-btn-play-big" id="btn-play-main" type="button" aria-label="Play / Pausa">
        <i class="bi bi-play-fill text-black"></i>
      </button>
      <button class="pulse-btn-icon" id="btn-next" type="button" aria-label="Siguiente">
        <i class="bi bi-skip-end-fill fs-2"></i>
      </button>
      <button class="pulse-btn-icon" id="btn-repeat" type="button" aria-label="Repetir">
        <i class="bi bi-repeat fs-5"></i>
      </button>
    </div>

    <div class="pulse-full-volume-row">
      <button class="pulse-btn-icon" id="btn-volume-toggle" type="button" aria-label="Silenciar">
        <i class="bi bi-volume-up-fill" id="volume-icon"></i>
      </button>
      <input type="range" class="form-range player-range flex-grow-1" id="volume-bar" min="0" max="100" value="70">
    </div>

    <section class="queue-section border-top border-dark-subtle pt-3 mt-3 d-none d-lg-block">
      <span class="text-white fw-semibold extra-small d-block mb-2" style="letter-spacing: 0.5px;">SIGUIENTE EN COLA</span>
      <div class="d-flex flex-column gap-1" id="queue-list-container">
        <p class="text-muted-pulse extra-small py-2 text-center">Fila vacía</p>
      </div>
    </section>

  </div>
</aside>
