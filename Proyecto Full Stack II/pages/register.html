<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse - Crear Cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>

<body class="bg-black text-white vh-100 d-flex align-items-center justify-content-center m-0 p-3">

  <div class="auth-card">

    <div class="text-center mb-4">
      <div class="rounded-0 p-2 d-inline-flex align-items-center justify-content-center mb-3 shadow"
        style="background-color: var(--purple-accent); width: 48px; height: 48px;">
        <i class="bi bi-activity text-white fs-4"></i>
      </div>
      <h1 class="fw-bold fs-3 text-white mb-1" style="letter-spacing: 0.05rem;">Pulse</h1>
      <p class="text-muted-pulse extra-small">Crea tu cuenta y empieza a escuchar música sin límites</p>
    </div>

    <div id="register-alert" class="alert alert-danger py-2 small d-none rounded-0" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="mb-3">
        <label for="register-name" class="form-label text-muted-pulse extra-small fw-bold text-uppercase">Nombre
          completo</label>
        <div class="input-group">
          <span class="input-group-text search-input border-end-0 text-muted-pulse rounded-0">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" id="register-name" class="form-control search-input border-start-0 rounded-0"
            placeholder="Tu nombre" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="register-email" class="form-label text-muted-pulse extra-small fw-bold text-uppercase">Correo
          electrónico</label>
        <div class="input-group">
          <span class="input-group-text search-input border-end-0 text-muted-pulse rounded-0">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" id="register-email" class="form-control search-input border-start-0 rounded-0"
            placeholder="nombre@ejemplo.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="register-password"
          class="form-label text-muted-pulse extra-small fw-bold text-uppercase">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text search-input border-end-0 text-muted-pulse rounded-0">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="register-password" class="form-control search-input border-start-0 rounded-0"
            placeholder="Mínimo 6 caracteres" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="register-confirm-password"
          class="form-label text-muted-pulse extra-small fw-bold text-uppercase">Confirmar contraseña</label>
        <div class="input-group">
          <span class="input-group-text search-input border-end-0 text-muted-pulse rounded-0">
            <i class="bi bi-shield-check"></i>
          </span>
          <input type="password" id="register-confirm-password"
            class="form-control search-input border-start-0 rounded-0" placeholder="Repite tu contraseña" required>
        </div>
      </div>

      <button type="submit" class="btn text-white fw-bold w-100 py-2 btn-pulse-primary shadow-sm">
        Crear cuenta
      </button>
    </form>

    <div class="text-center mt-4">
      <span class="text-muted-pulse extra-small">¿Ya tienes cuenta? <a href="login.html"
          class="text-white text-decoration-none fw-semibold">Inicia sesión</a></span>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/register.js"></script>
</body>

</html>
